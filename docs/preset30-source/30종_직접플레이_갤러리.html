for(let b of document.querySelectorAll('[data-a]')){let k='btn'+b.dataset.a,a=Number(b.dataset.a);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);beginKey(k,a)});b.addEventListener('pointerup',()=>endKey(k));b.addEventListener('pointercancel',()=>endKey(k))}
$('viewer').addEventListener('wheel',e=>{if(e.ctrlKey||e.altKey){e.preventDefault();zoom(e.deltaY>0?.9:1.1)}},{passive:false});
window.addEventListener('resize',()=>fit());tabs();setMap(0);
</script></body></html>
